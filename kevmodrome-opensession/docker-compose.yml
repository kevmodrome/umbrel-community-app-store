services:
  app_proxy:
    environment:
      APP_HOST: kevmodrome-opensession_server_1
      APP_PORT: 3850

  server:
    image: ghcr.io/kevmodrome/umbrel-opensession:0.4.82-1@sha256:b037551f489791a8651eb5e1f5b038228985f5637c57e6e0a5fdefee6ff11519
    restart: on-failure
    stop_grace_period: 30s
    environment:
      OPENSESSION_UI_BASE: http://${DEVICE_DOMAIN_NAME}:13850
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/opensession
      - ${APP_DATA_DIR}/data/workspace:/workspace
