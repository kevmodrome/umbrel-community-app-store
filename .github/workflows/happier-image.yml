name: Build Happier image

on:
  push:
    branches: [master]
    paths:
      - images/happier/Dockerfile
      - images/happier/start-runner.sh
  workflow_dispatch:
    inputs:
      test_image:
        description: Immutable fully qualified image reference to test without building
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: happier-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kevmodrome/umbrel-happier
  IMAGE_TAG: stable-a2c45c86804b-1
  RELAY_IMAGE: happierdev/relay-server:stable-a2c45c86804b@sha256:3f6068f9659980c7cc34456ff844b6bad9e127c18a6642690299dea1e1e4186e

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up emulation
        if: ${{ !inputs.test_image }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: ${{ !inputs.test_image }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Container Registry
        if: ${{ !inputs.test_image }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both architectures
        id: build
        if: ${{ !inputs.test_image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/happier/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node.js for native protocol smoke checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: images/happier/tests/package-lock.json

      - name: Test the published AMD64 image
        env:
          IMAGE_REF: ${{ inputs.test_image || format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE_REF"
          HAPPIER_TEST_IMAGE="$IMAGE_REF" bash images/happier/smoke-test.sh
          npm ci --ignore-scripts --no-audit --no-fund --prefix images/happier/tests
          bash images/happier/integration-smoke.sh "$IMAGE_REF" "$RELAY_IMAGE"

      - name: Record immutable image reference
        env:
          IMAGE_REF: ${{ inputs.test_image || format('{0}:{1}@{2}', env.IMAGE, env.IMAGE_TAG, steps.build.outputs.digest) }}
        run: |
          printf '### Happier image\n\n`%s`\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
